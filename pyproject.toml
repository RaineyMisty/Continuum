[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostgraph-starter"
version = "0.2.0"
description = "Resumable Python modernization and memory continuation experiments"
requires-python = ">=3.10"
dependencies = ["openai>=1.50,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ghostgraph = "ghostgraph.cli:main"

[tool.setuptools.packages.find]
include = ["ghostgraph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
