[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostgraph-starter"
version = "0.1.0"
description = "LLM-driven legacy Python modernization with an interchangeable context adapter"
requires-python = ">=3.10"
dependencies = ["openai>=1.50,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ghostgraph = "ghostgraph.cli:main"

[tool.setuptools.packages.find]
include = ["ghostgraph*"]
